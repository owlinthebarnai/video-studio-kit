<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../engine/vendor/three.module.js"}}</script>
</head><body>
<canvas id="film" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script type="module">
import { THREE, createStage, box, mat, practical, coldFill, accent, clamp, lerp, ease, spring, rng,
         hud, ruleSticker, caption, chunkCaptions, loadFonts, ik2 } from '../engine/stage.js';

const film = document.getElementById('film');
const stage = createStage(film);
const { scene, renderer } = stage;
const frac = x => x - Math.floor(x);

// ================= the set: night, outside a cave =================
const set = new THREE.Group(); stage.sets.cave = set; scene.add(set);
scene.background = new THREE.Color('#0c1630');
scene.fog = new THREE.Fog('#0c1630', 14, 60);

// ground: low-poly facets, flat near the fire pit
{
  const g = new THREE.PlaneGeometry(40, 40, 40, 40); g.rotateX(-Math.PI / 2);
  const R = rng(11), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z + 1);
    p.setY(i, r < 2.2 ? 0 : (R() - 0.5) * 0.18 * Math.min(1, (r - 2.2) / 2) + (z < -6 ? (-6 - z) * 0.08 : 0)); }
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, mat('#3d3a2c')); ground.receiveShadow = true; set.add(ground);
}
const rock = (x, y, z, sx, sy, sz, color = '#625c55', seed = 1, detail = 0) => {
  const geo = new THREE.IcosahedronGeometry(1, detail), R = rng(seed), p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = 0.85 + R() * 0.3; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat(color)); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.y = seed * 0.7;
  m.castShadow = true; m.receiveShadow = true; set.add(m); return m;
};
// the cave: a dark mouth framed by big low-poly rocks, a mountain behind
{
  const mouth = new THREE.Mesh(new THREE.CircleGeometry(0.95, 9, 0, Math.PI), new THREE.MeshBasicMaterial({ color: '#040406' }));
  mouth.scale.set(1, 1.55, 1); mouth.position.set(-0.35, 0, -2.55); set.add(mouth);
  set.add(box(2.2, 1.6, 0.2, '#050507', -0.35, 0, -2.75));
  rock(-1.75, 0.9, -2.9, 1.05, 1.7, 0.9, '#5f5952', 3);
  rock(1.05, 0.95, -2.9, 1.0, 1.8, 0.95, '#625c55', 5);
  rock(-0.35, 2.15, -2.95, 1.9, 0.85, 1.0, '#58534c', 7);
  rock(-0.4, 2.6, -4.6, 5.2, 3.2, 1.6, '#4a4641', 9, 1);
  rock(-4.2, 1.4, -5.2, 2.6, 2.2, 1.4, '#46423d', 13, 1);
  rock(3.6, 1.5, -5.0, 2.6, 2.4, 1.4, '#46423d', 17, 1);
  rock(-1.25, 0.12, -1.4, 0.32, 0.24, 0.28, '#6a645c', 21);
  rock(1.25, 0.1, -0.9, 0.26, 0.2, 0.24, '#6a645c', 23);
  rock(0.95, 0.08, -2.2, 0.36, 0.2, 0.3, '#6a645c', 25);
}
// low-poly pines at the sides
const pine = (x, z, s) => { const g = new THREE.Group();
  g.add(box(0.14 * s, 0.5 * s, 0.14 * s, '#4a3424', 0, 0, 0));
  for (let i = 0; i < 3; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry((0.75 - i * 0.18) * s, 0.95 * s, 6), mat(i % 2 ? '#22402f' : '#1d3828'));
    c.position.y = (0.75 + i * 0.5) * s; c.castShadow = true; c.receiveShadow = true; g.add(c); }
  g.position.set(x, 0, z); set.add(g); };
pine(-2.25, -1.3, 1.25); pine(2.35, -1.6, 1.4); pine(-3.3, -3.4, 1.6); pine(3.4, -3.0, 1.5); pine(-2.0, 1.4, 1.0); pine(2.2, 1.0, 1.05);
// sky: stars high on a far dome, and a moon top-right
{
  const R = rng(5), pts = [];
  for (let i = 0; i < 260; i++) { const a = (R() - 0.5) * 1.6, e = 0.18 + R() * 0.9, r = 80; pts.push(Math.sin(a) * r * Math.cos(e), Math.sin(e) * r, -Math.cos(a) * r * Math.cos(e)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  set.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#dfe6ff', size: 2.2, sizeAttenuation: false, fog: false })));
  const moon = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 1), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.75, 0.8, 0.95), toneMapped: false, fog: false }));
  moon.position.set(13, 30, -72); set.add(moon);
}

// ================= lights =================
const cold = coldFill(scene, '#5d7bb3', 0.6);
const moonSpot = accent('#9db8ff', 40, 0.55); moonSpot.position.set(-3.5, 7, 2.5); moonSpot.target.position.set(-0.2, 0.5, 0); scene.add(moonSpot, moonSpot.target);
const fireLight = practical('#ff9440', 0, 12); fireLight.userData.bulb.visible = false; fireLight.position.set(0.02, 0.45, 0.22); scene.add(fireLight);
const faceFill = new THREE.PointLight('#ff9a50', 0, 4, 1.6); faceFill.position.set(0.1, 1.2, 1.2); scene.add(faceFill);   // fire bounce on his face

// ================= the fire pit (hearth board, stones, teepee) =================
const PIT = new THREE.Vector3(0.02, 0, 0.22);
const pit = new THREE.Group(); pit.position.copy(PIT); set.add(pit);
{
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; const s = new THREE.Mesh(new THREE.DodecahedronGeometry(0.075, 0), mat(i % 2 ? '#77716a' : '#6b655e'));
    s.position.set(Math.cos(a) * 0.3, 0.05, Math.sin(a) * 0.26); s.rotation.set(i, i * 2, 0); s.castShadow = true; s.receiveShadow = true; pit.add(s); }
  const board = box(0.46, 0.035, 0.12, '#8a6038', -0.02, 0, 0.02); board.rotation.y = 0.25; pit.add(board);
  for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + 0.4; const l = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, 0.42, 6), mat(i % 2 ? '#6e4a2c' : '#5c3d24'));
    l.position.set(Math.cos(a) * 0.1, 0.17, Math.sin(a) * 0.09); l.rotation.set(Math.sin(a) * 0.55, 0, -Math.cos(a) * 0.55); l.castShadow = true; pit.add(l); }
  const tinder = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), mat('#b89a5a')); tinder.scale.set(1.3, 0.6, 1); tinder.position.y = 0.05; pit.add(tinder);
}
// flames: low-poly cones, hot colours above 1 so the bloom catches them
const flames = [];
const FL = [ // [x, z, radius, height, colour, phase, layer]
  [0.00, 0.00, 0.20, 0.95, [2.4, 0.55, 0.12], 0.0, 0], [-0.10, -0.03, 0.13, 0.62, [2.2, 0.45, 0.1], 1.7, 0], [0.11, -0.02, 0.13, 0.7, [2.3, 0.5, 0.1], 3.1, 0],
  [0.00, 0.06, 0.14, 0.72, [2.8, 1.25, 0.25], 0.8, 1], [-0.07, 0.07, 0.08, 0.45, [2.7, 1.1, 0.2], 2.4, 1], [0.08, 0.07, 0.08, 0.5, [2.7, 1.2, 0.22], 4.0, 1],
  [0.00, 0.11, 0.08, 0.45, [3.2, 2.6, 1.1], 1.3, 2], [0.04, 0.12, 0.045, 0.3, [3.4, 3.0, 1.6], 5.2, 2]];
for (const f of FL) {
  const geo = new THREE.ConeGeometry(f[2], f[3], 5, 1); geo.translate(0, f[3] / 2, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color(...f[4]), toneMapped: false, depthTest: f[6] === 0, fog: false }));
  m.renderOrder = 10 + f[6]; m.position.set(f[0], 0.06, f[1]); m.visible = false; pit.add(m); flames.push({ m, f });
}
// a soft glow sprite: the ember, the spark flash and the fire's halo
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,220,150,0.8)'); g.addColorStop(1, 'rgba(255,120,40,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const sprite = (color) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false }));
  s.renderOrder = 20; s.visible = false; pit.add(s); return s; };
const ember = sprite(new THREE.Color(2.5, 0.8, 0.2)); ember.position.set(0, 0.07, 0.02);
const flash = sprite(new THREE.Color(3, 2.6, 1.8)); flash.position.set(0, 0.1, 0.05);
const halo = sprite(new THREE.Color(0.7, 0.28, 0.08)); halo.position.set(0, 0.45, 0);
// sparks (burst at the spark) and embers (rise from the fire); seeded, sampled by time
const bits = []; { const R = rng(31);
  for (let i = 0; i < 36; i++) { const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.018, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 1.6, 0.4), toneMapped: false, fog: false }));
    m.renderOrder = 15; m.visible = false; pit.add(m); bits.push({ m, a: R() * Math.PI * 2, v: 0.8 + R() * 1.4, up: 1.2 + R() * 1.8, ph: R(), rate: 0.55 + R() * 0.5, sw: R() * 6 }); } }
// the smoke curl: small grey low-poly puffs from the drill tip
const puffs = []; { for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: '#b9bcc4', flatShading: true, transparent: true, opacity: 0, roughness: 1, depthWrite: false }));
  m.visible = false; pit.add(m); puffs.push(m); } }

// ================= the caveman: the engine's flat stickman look, on a wider canvas so he can crouch =================
const BN = { torso: 230, neck: 30, head: 58, upper: 135, fore: 125, thigh: 170, shin: 165 };
const PX = 1024 / 1.75;   // canvas px per metre (same scale as the engine's Stickman)
class Caveman {
  constructor() {
    this.o = { body: '#f1ede4', outline: '#15171c', tunic: '#a5713d', spot: '#6a4424' };
    this.cv = document.createElement('canvas'); this.cv.width = 1024; this.cv.height = 1024;
    this.tex = new THREE.CanvasTexture(this.cv); this.tex.colorSpace = THREE.SRGBColorSpace;
    const g = new THREE.PlaneGeometry(1.75, 1.75); g.translate(0, 1.75 / 2, 0);
    this.mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: this.tex, alphaTest: 0.5, side: THREE.DoubleSide, emissive: '#ffffff', emissiveMap: this.tex, emissiveIntensity: 0.2, roughness: 1 }));
    this.mesh.castShadow = true;
    this.mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: this.tex, alphaTest: 0.5 });
    this.mesh.userData.billboard = cam => { const p = new THREE.Vector3(); cam.getWorldPosition(p); this.mesh.rotation.y = Math.atan2(p.x - this.mesh.position.x, p.z - this.mesh.position.z); };
  }
  // p: {hip, lean, headTilt, handL, handR, footL, footR, bendL, bendR (elbows), stick: angle or null}
  pose(p) {
    const c = this.cv.getContext('2d'), o = this.o; c.clearRect(0, 0, 1024, 1024);
    const hip = p.hip, lean = p.lean, ht = lean + (p.headTilt || 0);
    const neck = [hip[0] + Math.sin(lean) * BN.torso, hip[1] - Math.cos(lean) * BN.torso];
    const head = [neck[0] + Math.sin(ht) * (BN.neck + BN.head), neck[1] - Math.cos(ht) * (BN.neck + BN.head)];
    const sh = [neck[0] - Math.sin(lean) * 24, neck[1] + Math.cos(lean) * 24];
    const reach = (root, tgt, l1, l2, bend) => { const j = ik2(root, tgt, l1, l2, bend); const d = Math.hypot(tgt[0] - j[0], tgt[1] - j[1]) || 1;
      return [j, [j[0] + (tgt[0] - j[0]) / d * l2, j[1] + (tgt[1] - j[1]) / d * l2]]; };
    const AL = reach(sh, p.handL, BN.upper, BN.fore, p.bendL), AR = reach(sh, p.handR, BN.upper, BN.fore, p.bendR);
    const LL = reach(hip, p.footL, BN.thigh, BN.shin, 1), LR = reach(hip, p.footR, BN.thigh, BN.shin, 1);
    const stroke = (pts, w, col) => { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...pts[0]); for (const q of pts.slice(1)) c.lineTo(...q); c.stroke(); };
    // the drill stick, held in the front hand (drawn behind the arms)
    if (p.stick != null) { const h = AR[1], a = p.stick, s = Math.sin(a), co = Math.cos(a);
      const S = [[h[0] - s * -80, h[1] + co * -80], [h[0] - s * 190, h[1] + co * 190]];
      stroke(S, 30, o.outline); stroke(S, 14, '#9a6a3c'); }
    const parts = [[hip, neck], [sh, ...AL], [sh, ...AR], [hip, ...LL], [hip, ...LR]];
    for (const P of parts) stroke(P, 44, o.outline);
    c.fillStyle = o.outline; c.beginPath(); c.arc(head[0], head[1], BN.head + 11, 0, 7); c.fill();
    for (const P of parts) stroke(P, 24, o.body);
    c.fillStyle = o.body; c.beginPath(); c.arc(head[0], head[1], BN.head, 0, 7); c.fill();
    // the mark: a fur tunic with a zigzag hem, and wild hair
    const ux = (neck[0] - hip[0]) / BN.torso, uy = (neck[1] - hip[1]) / BN.torso, nx = -uy, ny = ux;
    const P = (along, side) => [hip[0] + ux * along + nx * side, hip[1] + uy * along + ny * side];
    const poly = [P(185, -30), P(185, 30), P(-55, 46)];
    for (let i = 0; i <= 6; i++) poly.push(P(i % 2 ? -42 : -72, 46 - i * 92 / 6));
    c.beginPath(); c.moveTo(...poly[0]); for (const q of poly.slice(1)) c.lineTo(...q); c.closePath();
    c.fillStyle = o.tunic; c.fill(); c.lineWidth = 10; c.lineJoin = 'round'; c.strokeStyle = o.outline; c.stroke();
    c.fillStyle = o.spot; for (const [a, s] of [[120, -8], [40, 14], [-20, -18], [80, 18]]) { const q = P(a, s); c.beginPath(); c.ellipse(q[0], q[1], 9, 6, lean, 0, 7); c.fill(); }
    stroke([P(185, 30), P(150, 34)], 0.1, o.outline);
    c.fillStyle = o.outline; c.beginPath();                               // hair: spiky tufts over the top and back of the head
    const hx = head[0], hy = head[1], R0 = BN.head + 6, a0 = ht - Math.PI / 2 + 0.5, a1 = ht - Math.PI - 0.6;
    for (let i = 0; i <= 10; i++) { const a = lerp(a0, a1, i / 10), r = R0 + (i % 2 ? 4 : 30);
      const q = [hx + Math.cos(a) * r, hy + Math.sin(a) * r]; i ? c.lineTo(...q) : c.moveTo(...q); }
    c.arc(hx, hy, R0 - 24, a1, a0, false); c.closePath(); c.fill();
    c.fillStyle = o.outline; const ex = head[0] + Math.cos(ht) * 30, ey = head[1] - 2 + Math.sin(ht) * 30;   // dot eye, no mouth
    c.beginPath(); c.arc(ex, ey, p.mood === 'joy' ? 9 : 8, 0, 7); c.fill();
    this.tex.needsUpdate = true;
  }
}
const cave = new Caveman(); set.add(cave.mesh);
const MAN = new THREE.Vector3(-0.42, -0.024, 0);    // canvas x 760 (the drill tip) lands on the pit
cave.mesh.position.copy(MAN);

// ================= captions, HUD, rule =================
const CHUNKS = chunkCaptions(TIMING); window.CHUNKS = CHUNKS;
for (const ch of CHUNKS) for (const w of ch.words) if (/^fire$/i.test(w.w)) w.w = 'Fire!';

window.TOTAL = 5.0;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const warmC = new THREE.Color('#ffd2a0'), white = new THREE.Color('#ffffff');

window.seek = t => {
  stage.use('cave');
  const lit = clamp(spring((t - 3.05) * 1.25), 0, 1.25);                     // the fire: 0 before the spark, a burst with overshoot
  const on = t >= 3.05, burst = clamp((t - 3.05) / 0.35);
  // ----- the caveman -----
  const rubHz = t < 2 ? 2.4 : 3.2, ph = Math.sin(t * rubHz * Math.PI * 2);
  const up = ease((t - 3.15) / 0.55);                                        // crouch -> standing, arms up
  const hop = t > 3.75 ? Math.abs(Math.sin((t - 3.75) * Math.PI * 1.7)) * ease((t - 3.75) / 0.2) : 0;
  const sx = 760, bob = (1 - up) * Math.sin(t * rubHz * Math.PI * 4) * 4;
  const cr = { hip: [470, 805 + bob], lean: 0.78 + (t > 2 && t < 3.1 ? 0.06 * ease((t - 2) / 0.4) : 0), headTilt: 0.12,
    handL: [sx - 8, 845 + 22 * ph], handR: [sx + 6, 845 - 22 * ph], footL: [535, 1005], footR: [440, 1005] };
  const pump = Math.sin((t - 3.75) * Math.PI * 3.4) * 18 * (t > 3.75 ? 1 : 0);
  const jy = { hip: [395, 690], lean: -0.1, headTilt: -0.32,
    handL: [235, 268 - pump], handR: [535, 262 + pump], footL: [430, 1005], footR: [360, 1005] };
  cave.pose({ hip: lerp2(cr.hip, jy.hip, up), lean: lerp(cr.lean, jy.lean, up), headTilt: lerp(cr.headTilt, jy.headTilt, up),
    handL: lerp2(cr.handL, jy.handL, up), handR: lerp2(cr.handR, jy.handR, up), footL: lerp2(cr.footL, jy.footL, up), footR: lerp2(cr.footR, jy.footR, up),
    bendL: up > 0.5 ? 1 : -1, bendR: -1, stick: lerp(0.05 * ph * (1 - up), Math.PI - 0.35, up), mood: up > 0.5 ? 'joy' : '' });
  cave.mesh.position.set(MAN.x, MAN.y + hop * 0.09, MAN.z);
  cave.mesh.material.emissive.copy(white).lerp(warmC, clamp(lit));
  cave.mesh.material.emissiveIntensity = 0.2 - 0.12 * clamp(lit);
  // ----- smoke curl (2-3 s, drifting up after) -----
  puffs.forEach((m, i) => { const born = 1.85 + i * 0.065, a = t - born;
    if (a < 0 || a > 2.4 || born > 3.05) { m.visible = false; return; }
    m.visible = true; const k = a / 2.4;
    m.position.set(Math.sin(a * 2.6 + i * 0.35) * 0.06 * (0.3 + a) + a * 0.05, 0.09 + a * 0.42 + (on ? a * 0.2 : 0), 0.04 + Math.cos(a * 2.1 + i) * 0.03);
    m.scale.setScalar(0.012 + a * 0.028); m.rotation.set(a * 2 + i, i, a);
    m.material.opacity = 0.42 * clamp(a / 0.15) * (1 - k) * (on ? clamp(1 - (t - 3.05) / 0.35) : 1); });
  // ----- ember, spark, flames -----
  const emb = clamp((t - 2.25) / 0.6);
  ember.visible = t > 2.25 && t < 3.3; ember.scale.setScalar(0.05 + 0.06 * emb * (0.8 + 0.2 * Math.sin(t * 31)));
  const fk = Math.max(0, 1 - Math.abs(t - 3.02) / 0.16);
  flash.visible = fk > 0; flash.scale.setScalar(0.08 + 0.55 * fk);
  const flick = (x) => 0.86 + 0.14 * Math.sin(t * 13.1 + x) * Math.sin(t * 7.3 + x * 2.1);
  flames.forEach(({ m, f }, i) => { m.visible = on;
    if (!on) return; const fl = flick(f[5]);
    m.scale.set((0.55 + 0.45 * clamp(lit)) * (1.05 - 0.1 * fl), lit * fl * (1 + 0.08 * Math.sin(t * 9 + f[5])), (0.55 + 0.45 * clamp(lit)));
    m.rotation.set(0.07 * Math.sin(t * 5 + f[5]), t * (1.2 + i * 0.3) + f[5], 0.08 * Math.sin(t * 6.3 + f[5] * 2)); });
  halo.visible = on; halo.scale.setScalar(0.9 * clamp(lit) * flick(9)); halo.position.y = 0.42 * clamp(lit);
  bits.forEach((b, i) => { const m = b.m;
    if (t > 2.98 && t < 3.6 && i < 14) {                                      // the spark burst
      const a = t - 2.98; m.visible = true;
      m.position.set(Math.cos(b.a) * b.v * a * 0.6, 0.08 + b.up * a - 4.9 * a * a, Math.sin(b.a) * b.v * a * 0.3); m.scale.setScalar(1 - a / 0.62);
    } else if (t > 3.3 && i >= 14) {                                          // embers rising from the fire
      const u = frac((t - 3.3) * b.rate + b.ph); m.visible = u < 0.95 && (t - 3.3) * b.rate + b.ph > 0.0;
      m.position.set(Math.sin(u * b.sw + i) * 0.12 * u + (b.ph - 0.5) * 0.2, 0.25 + u * 1.25 * clamp(lit), (b.ph - 0.5) * 0.12); m.scale.setScalar((1 - u) * 1.2);
      m.rotation.set(t * 4 + i, t * 3, 0);
    } else m.visible = false; });
  // ----- light: night cold, then the fire takes over warm -----
  const fl = flick(3);
  fireLight.userData.light.intensity = (emb * 0.25 * (t < 3.05 ? 1 : 0)) + fk * 5 + clamp(lit) * 5.5 * fl;
  faceFill.intensity = clamp(lit) * 0.45 * fl;
  cold.hemi.intensity = lerp(0.6, 0.38, clamp(lit)); cold.dir.intensity = lerp(0.48, 0.3, clamp(lit));
  moonSpot.intensity = lerp(40, 22, clamp(lit));
  renderer.toneMappingExposure = 1.0 + 0.05 * clamp(lit);
  // ----- camera: close on the hands, a slow push, then pull back and up to make the fire the hero -----
  const push = ease(t / 3), pull = ease((t - 3.05) / 1.1);
  const pos = [lerp(lerp(0.05, 0.0, push), 0.12, pull), lerp(lerp(0.95, 0.88, push), 1.05, pull), lerp(lerp(3.25, 2.95, push), 3.85, pull)];
  const tgt = [lerp(lerp(-0.08, -0.06, push), -0.08, pull), lerp(0.36, 0.58, pull), 0];
  stage.aim(pos, tgt, 50);
  stage.draw(t, { bloomStrength: lerp(0.5, 0.7, clamp(lit)), vignette: 0.45 });
  // ----- overlay -----
  const c = stage.ctx;
  hud(c, 1, '9:00 PM');
  const rk = t < 2.55 ? clamp(spring(t - 0.1), 0, 1.15) : 1 - ease((t - 2.55) / 0.25);
  if (t < 2.8 && t >= 0.1) { c.save(); c.globalAlpha = t < 2.55 ? 1 : clamp(1 - (t - 2.55) / 0.25); ruleSticker(c, 1, 'MAKE FIRE', Math.max(0.01, rk), 470); c.restore(); }
  const ch = CHUNKS.find(x => t >= x.s && t < x.e);
  if (ch) { const k = clamp(spring((t - ch.s) * 1.4), 0, 1.15), s = 0.75 + 0.25 * k, big = ch.words.length === 1 ? 1.35 : 1;
    c.save(); c.translate(540, 1330); c.scale(s * big, s * big); c.translate(-540, -1330); caption(c, ch.words, 1330); c.restore(); }
};

await loadFonts();
window.seek(0);
window.READY = true;
</script>
